<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="blueprint-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" />
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="0.5" />
      <path d="M 20 0 L 20 40 M 0 20 L 40 20" fill="none" stroke="#21262d" stroke-width="0.2" />
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="#0d1117" />
  <rect width="1200" height="300" fill="url(#blueprint-grid)" />

  <g transform="translate(300, 150)" stroke="#30363d" stroke-width="1.5" fill="none">
    <circle cx="0" cy="0" r="130" stroke-dasharray="4,6" opacity="0.6" />
    <circle cx="0" cy="0" r="90" stroke-width="1" opacity="0.3" />
    <line x1="-140" y1="0" x2="-120" y2="0" />
    <line x1="120" y1="0" x2="140" y2="0" />
    <line x1="0" y1="-140" x2="0" y2="-120" />
    <line x1="0" y1="120" x2="0" y2="140" />
  </g>

  <g transform="translate(300, 140)">
    
    <g stroke-linejoin="round" stroke-linecap="round">
      <path d="M-20,-10 L-60,-25 L-75,30" fill="none" stroke="#161b22" stroke-width="16" />
      <path d="M-20,-10 L-60,-25 L-75,30" fill="none" stroke="#21262d" stroke-width="12" />
      <path d="M20,-10 L60,-25 L75,30" fill="none" stroke="#161b22" stroke-width="16" />
      <path d="M20,-10 L60,-25 L75,30" fill="none" stroke="#21262d" stroke-width="12" />
    </g>

    <path d="M-30,10 Q-50,30 -65,20" fill="none" stroke="#e36209" stroke-width="2.5" />
    <path d="M30,10 Q50,30 65,20" fill="none" stroke="#e36209" stroke-width="2.5" />
    <path d="M-15,-5 Q-40,0 -45,-15" fill="none" stroke="#e36209" stroke-width="2" />
    <path d="M15,-5 Q40,0 45,-15" fill="none" stroke="#e36209" stroke-width="2" />

    <g stroke-linejoin="round" stroke-linecap="round">
      <path d="M-25,15 L-75,5 L-95,70" fill="none" stroke="#161b22" stroke-width="18" />
      <path d="M-25,15 L-75,5 L-95,70" fill="none" stroke="#30363d" stroke-width="14" />
      <circle cx="-75" cy="5" r="5" fill="#0d1117" /> <path d="M25,15 L75,5 L95,70" fill="none" stroke="#161b22" stroke-width="18" />
      <path d="M25,15 L75,5 L95,70" fill="none" stroke="#30363d" stroke-width="14" />
      <circle cx="75" cy="5" r="5" fill="#0d1117" /> </g>

    <rect x="-35" y="10" width="70" height="25" rx="5" fill="#0d1117" stroke="#30363d" stroke-width="2" />
    <rect x="-20" y="30" width="40" height="15" rx="2" fill="#161b22" />

    <path d="M-16,-60 L16,-60 L24,15 L-24,15 Z" fill="#f0f6fc" stroke="#c9d1d9" stroke-width="2" stroke-linejoin="round" />
    <line x1="-16" y1="-60" x2="-24" y2="15" stroke="#ffffff" stroke-width="2" opacity="0.5" />

    <g filter="url(#glow-blue)">
      <rect x="-12" y="-15" width="10" height="9" rx="2" fill="#58a6ff" />
      <rect x="2" y="-15" width="10" height="9" rx="2" fill="#58a6ff" />
    </g>
  </g>

  <g font-family="monospace, sans-serif" font-size="10" fill="#8b949e">
    <polyline points="290,125 240,80 180,80" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.6"/>
    <circle cx="290" cy="125" r="2" fill="#58a6ff"/>
    <text x="55" y="83" fill="#58a6ff">DUAL_LED_MATRIX_EYES</text>

    <polyline points="300,90 350,50 395,50" fill="none" stroke="#30363d" stroke-width="1"/>
    <circle cx="300" cy="90" r="2" fill="#30363d"/>
    <text x="400" y="53">3D_PRINTED_MAIN_BODY</text>

    <polyline points="375,145 425,180 450,180" fill="none" stroke="#30363d" stroke-width="1"/>
    <circle cx="375" cy="145" r="2" fill="#30363d"/>
    <text x="455" y="183">SERVOS_ARTICULATION</text>

    <line x1="150" y1="270" x2="450" y2="270" stroke="#30363d" stroke-width="1"/>
    <line x1="150" y1="265" x2="150" y2="275" stroke="#30363d" stroke-width="1"/>
    <line x1="450" y1="265" x2="450" y2="275" stroke="#30363d" stroke-width="1"/>
  </g>

  <text x="740" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#f0f6fc" letter-spacing="1">Spider-Robot</text>
  <text x="740" y="180" font-family="monospace, sans-serif" font-size="16" fill="#8b949e" letter-spacing="1">PROJECT SHOWCASE</text>
  <text x="740" y="250" font-family="monospace, sans-serif" font-size="16" fill="#536b8c" letter-spacing="1">MADE BY</text>
  <text x="739" y="270" font-family="monospace, sans-serif" font-size="16" fill="#536880" letter-spacing="1">corde_t • kingki_n • brouar_l • judea_d</text>
 
  <g transform="translate(550, 55)" font-family="monospace, sans-serif" font-size="11" fill="#8b949e">
    <rect x="0" y="0" width="160" height="90" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="10" y="20" fill="#c9d1d9" font-weight="bold">ROBOT: DAMIEN</text>
    <line x1="10" y1="28" x2="150" y2="28" stroke="#30363d" stroke-width="1"/>
    <text x="10" y="45">MOTORS__ : <tspan fill="#3fb950">ONLINE</tspan></text>
    <text x="10" y="60">POWER___  : <tspan fill="#3fb950">5.0V</tspan></text>
    <text x="10" y="75">ESP32-S2  : <tspan fill="#58a6ff">ACTIVE</tspan></text>
  </g>

  <path d="M 20,40 L 20,20 L 40,20" fill="none" stroke="#30363d" stroke-width="2"/>
  <path d="M 1180,40 L 1180,20 L 1160,20" fill="none" stroke="#30363d" stroke-width="2"/>
  <path d="M 20,260 L 20,280 L 40,280" fill="none" stroke="#30363d" stroke-width="2"/>
  <path d="M 1180,260 L 1180,280 L 1160,280" fill="none" stroke="#30363d" stroke-width="2"/>

</svg>
